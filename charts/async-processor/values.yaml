ap:
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  image:
    repository: ghcr.io/llm-d-incubation/llm-d-async
    # Image tag. Leave empty to track the chart's appVersion (recommended so the
    # image stays in sync with the chart). Set explicitly to pin a different tag.
    tag: ""
  imagePullPolicy: Always
  concurrency: 8
  drainTimeout: "2m"
  prometheusURL: ""
  prometheusCacheTTL: ""
  # Named worker pools configuration. When specified, overrides the global concurrency option.
  # workerPools:
  #   - id: "default"
  #     workers: 8
  #   - id: "premium"
  #     workers: 16
  workerPools: []
  # Request body-transform plugins. When set, rendered to a config file and passed
  # via --transform-config-file. Object with a requestTransforms array; each entry
  # has a unique name, a registered plugin type, and opaque parameters. Empty
  # disables transforms (default JSON dispatch is unchanged).
  # transformConfig:
  #   requestTransforms:
  #     - name: "gcs-whisper"
  #       type: "gcs_uri_multipart"
  #       parameters:
  #         providers: ["whisper"]
  transformConfig: {}
  otel:
    # OTLP gRPC endpoint for trace collection. Leave empty to disable tracing.
    endpoint: ""
    insecure: true
    sampler: "parentbased_traceidratio"
    samplerArg: "1.0"
    redisTracing: false
  health:
    port: 8081
    livenessProbe:
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readinessProbe:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
    startupProbe:
      initialDelaySeconds: 0
      periodSeconds: 2
      timeoutSeconds: 3
      failureThreshold: 30
  metrics:
    enabled: true
    port: 9090
    secure: false
  # Transport type. Supported: "redis-sortedset", "redis-pubsub", "gcp-pubsub".
  transport: "redis-sortedset"
  # Transport configuration object. Serialized to JSON and passed via --transport-config.
  # The structure depends on the transport type.
  #
  # redis-sortedset example:
  #   transportConfig:
  #     result_queue_name: "result-list"
  #     poll_interval_ms: 1000
  #     batch_size: 10
  #     enable_tracing: false
  #     queues:
  #       - queue_name: "request-sortedset"
  #         worker_pool_id: "default"
  #         igw_base_url: "http://igw:80"
  #         request_path_url: "/v1/completions"
  #         gate_type: "prometheus-saturation"
  #         gate_params:
  #           pool: "pool-1"
  #           threshold: 0.7
  #
  # redis-pubsub example:
  #   transportConfig:
  #     retry_queue_name: "retry-sortedset"
  #     result_queue_name: "result-queue"
  #     queues:
  #       - queue_name: "request-queue"
  #         worker_pool_id: "default"
  #         igw_base_url: "http://igw:80"
  #         request_path_url: "/v1/completions"
  #
  # gcp-pubsub example:
  #   transportConfig:
  #     project_id: "my-project"
  #     result_topic_id: "results"
  #     batch_size: 10
  #     topics:
  #       - subscriber_id: "projects/my-project/subscriptions/sub-1"
  #         worker_pool_id: "default"
  #         igw_base_url: "http://igw:80"
  #         request_path_url: "/v1/completions"
  #         gate_type: "prometheus-saturation"
  #         gate_params:
  #           pool: "pool-1"
  #           threshold: 0.7
  transportConfig: {}
  tls:
    secretName: ""
    insecureSkipVerify: false
    caCertKey: ""
    certKey: ""
    keyKey: ""
  # Redis connection secret. The URL is injected as the REDIS_URL env var
  # and overrides any "url" field in transportConfig.
  redis:
    enabled: false
    # Option 1: provide the URL directly — chart creates the Secret automatically.
    # WARNING: Helm values are retrievable via `helm get values` and may expose credentials.
    # For production or credentialed URLs, prefer Option 2 (secretName/secretKey).
    # url: "redis://redis-master.redis.svc.cluster.local:6379"
    # Option 2: reference a pre-existing Secret (used when url is not set).
    secretName: "redis-creds"
    secretKey: "url"
  # PodMonitor for async-processor metrics scraping.
  podMonitor:
    enabled: false
    interval: "30s"
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
    rules:
      highRetryRate:
        enabled: true
        threshold: 0.5
        for: "15m"
      highDeadlineExceededRate:
        enabled: true
        threshold: 0.1
        for: "10m"
      lowSuccessRate:
        enabled: true
        threshold: 0.9
        for: "10m"
      highShedRate:
        enabled: true
        threshold: 0.1
        for: "10m"
  grafana:
    dashboards:
      enabled: false
      label: grafana_dashboard
      labelValue: "1"
  # PodMonitor for model server metrics relabeling.
  modelServerMonitor:
    enabled: false
    selector:
      llm-d.ai/role: decode
    port: modelserver
    path: /metrics
    interval: 15s
