apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "async-processor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "async-processor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "async-processor.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "async-processor.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /async-processor
        args:
          - --igw-base-url={{ .Values.ap.igwBaseURL }}
          {{- if .Values.ap.redis.enabled }}
          - --message-queue-impl={{ .Values.ap.redis.impl | default "redis-pubsub" }}
          {{- if eq (.Values.ap.redis.impl | default "redis-pubsub") "redis-sortedset-gated" }}
          - --redis.ss.addr={{ .Values.ap.redis.host }}:{{ .Values.ap.redis.port }}
          - --redis.ss.request-queue-name={{ .Values.ap.redis.sortedSet.requestQueueName | default "request-sortedset" }}
          - --redis.ss.result-queue-name={{ .Values.ap.redis.sortedSet.resultQueueName | default "result-list" }}
          - --redis.ss.poll-interval-ms={{ .Values.ap.redis.sortedSet.pollIntervalMs | default 1000 }}
          - --redis.ss.batch-size={{ .Values.ap.redis.sortedSet.batchSize | default 10 }}
          {{- else }}
          - --redis.request-path-url
          - "{{ .Values.ap.redis.requestPathURL }}"
          - --redis.addr
          - "{{ .Values.ap.redis.host }}:{{ .Values.ap.redis.port }}"
          {{- end }}
          {{- else if .Values.gcpPubSub.enabled  }}
          - --message-queue-impl=gcp-pubsub
          - pubsub.request-subscriber-id={{ .Values.ap.gcpPubSub.requestSubscriberId }}
          - pubsub.result-topic-id={{ .Values.ap.gcpPubSub.resultTopicId }}
          - --pubsub.request-path-url
          - "{{ .Values.ap.gcpPubSub.requestPathURL }}"
          {{- end}}
          {{- if and .Values.ap.dispatchGate (ne .Values.ap.dispatchGate.type "noop") }}
          - --dispatch-gate={{ .Values.ap.dispatchGate.type }}
          {{- if .Values.ap.dispatchGate.prometheus.url }}
          - --gate.prometheus.url={{ .Values.ap.dispatchGate.prometheus.url }}
          {{- end }}
          {{- if .Values.ap.dispatchGate.prometheus.insecureSkipVerify }}
          - --gate.prometheus.insecure-skip-verify=true
          {{- end }}
          {{- if eq .Values.ap.dispatchGate.type "metric-saturation" }}
          {{- if .Values.ap.dispatchGate.saturation.inferencePool }}
          - --gate.saturation.inference-pool={{ .Values.ap.dispatchGate.saturation.inferencePool }}
          {{- end }}
          - --gate.saturation.threshold={{ .Values.ap.dispatchGate.saturation.threshold | default 0.8 }}
          {{- end }}
          {{- if eq .Values.ap.dispatchGate.type "metric-avg-queue-size" }}
          {{- if .Values.ap.dispatchGate.avgQueueSize.modelName }}
          - --gate.prometheus.model-name={{ .Values.ap.dispatchGate.avgQueueSize.modelName }}
          {{- end }}
          {{- end }}
          {{- end }}
          - --metrics-endpoint-auth={{ .Values.ap.metrics.secure }}
        image: "{{ .Values.ap.image.repository }}:{{ .Values.ap.image.tag }}"
        imagePullPolicy: "{{ .Values.ap.imagePullPolicy }}"
        env:
          - name: LOG_LEVEL
            value: {{ if .Values.ap.logging }}{{ .Values.ap.logging.level | default "info" | quote }}{{ else }}"info"{{ end }}
        name: async-processor
      serviceAccountName: {{ include "async-processor.fullname" . }}
      terminationGracePeriodSeconds: 130
