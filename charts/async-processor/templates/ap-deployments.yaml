apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "async-processor.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "async-processor.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "async-processor.selectorLabels" . | nindent 6 }}
  replicas: 1
  template:
    metadata:
      labels:
        {{- include "async-processor.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /async-processor
        args:
          - --transport={{ .Values.ap.transport }}
          - --transport-config-file=/etc/async-processor/config/transport.json
          {{- if .Values.ap.prometheusURL }}
          - --prometheus-url={{ .Values.ap.prometheusURL }}
          {{- end }}
          {{- if .Values.ap.prometheusCacheTTL }}
          - --prometheus-cache-ttl={{ .Values.ap.prometheusCacheTTL }}
          {{- end }}
          {{- if .Values.ap.workerPools }}
          - --pool-config-file=/etc/async-processor/config/worker-pools.json
          {{- end }}
          {{- if .Values.ap.transformConfig }}
          - --transform-config-file=/etc/async-processor/config/transform-config.json
          {{- end }}
          - --concurrency={{ .Values.ap.concurrency | default 8 }}
          - --drain-timeout={{ .Values.ap.drainTimeout | default "2m" }}
          - --health-port={{ .Values.ap.health.port | default 8081 }}
          - --metrics-endpoint-auth={{ .Values.ap.metrics.secure }}
          - --metrics-port={{ .Values.ap.metrics.port | default 9090 }}
          {{- if .Values.ap.tls.insecureSkipVerify }}
          - --tls-insecure-skip-verify=true
          {{- end }}
          {{- if .Values.ap.tls.caCertKey }}
          - --tls-ca-cert=/etc/tls/{{ .Values.ap.tls.caCertKey }}
          {{- end }}
          {{- if and .Values.ap.tls.certKey .Values.ap.tls.keyKey }}
          - --tls-cert=/etc/tls/{{ .Values.ap.tls.certKey }}
          - --tls-key=/etc/tls/{{ .Values.ap.tls.keyKey }}
          {{- end }}
        image: "{{ .Values.ap.image.repository }}:{{ .Values.ap.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: "{{ .Values.ap.imagePullPolicy }}"
        env:
          - name: LOG_LEVEL
            value: {{ if .Values.ap.logging }}{{ .Values.ap.logging.level | default "info" | quote }}{{ else }}"info"{{ end }}
          {{- if .Values.ap.otel.endpoint }}
          - name: POD_NAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: {{ .Values.ap.otel.endpoint | quote }}
          - name: OTEL_EXPORTER_OTLP_INSECURE
            value: {{ .Values.ap.otel.insecure | quote }}
          - name: OTEL_TRACES_SAMPLER
            value: {{ .Values.ap.otel.sampler | quote }}
          - name: OTEL_TRACES_SAMPLER_ARG
            value: {{ .Values.ap.otel.samplerArg | quote }}
          - name: OTEL_SERVICE_NAME
            value: "async-processor"
          - name: OTEL_RESOURCE_ATTRIBUTES
            value: "k8s.namespace.name=$(NAMESPACE),k8s.pod.name=$(POD_NAME),service.version={{ .Chart.AppVersion }}"
          {{- end }}
          {{- if .Values.ap.redis.enabled }}
          - name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: {{ include "async-processor.redisSecretName" . }}
                key: {{ include "async-processor.redisSecretKey" . }}
          {{- end }}
        name: async-processor
        ports:
          - name: metrics
            containerPort: {{ .Values.ap.metrics.port | default 9090 }}
            protocol: TCP
          - name: health
            containerPort: {{ .Values.ap.health.port | default 8081 }}
            protocol: TCP
        startupProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: {{ .Values.ap.health.startupProbe.initialDelaySeconds | default 0 }}
          periodSeconds: {{ .Values.ap.health.startupProbe.periodSeconds | default 2 }}
          timeoutSeconds: {{ .Values.ap.health.startupProbe.timeoutSeconds | default 3 }}
          failureThreshold: {{ .Values.ap.health.startupProbe.failureThreshold | default 30 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: {{ .Values.ap.health.livenessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.ap.health.livenessProbe.periodSeconds | default 10 }}
          timeoutSeconds: {{ .Values.ap.health.livenessProbe.timeoutSeconds | default 3 }}
          failureThreshold: {{ .Values.ap.health.livenessProbe.failureThreshold | default 3 }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: {{ .Values.ap.health.readinessProbe.initialDelaySeconds | default 5 }}
          periodSeconds: {{ .Values.ap.health.readinessProbe.periodSeconds | default 5 }}
          timeoutSeconds: {{ .Values.ap.health.readinessProbe.timeoutSeconds | default 3 }}
          failureThreshold: {{ .Values.ap.health.readinessProbe.failureThreshold | default 3 }}
        {{- with .Values.ap.securityContext }}
        securityContext:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- with .Values.ap.resources }}
        resources:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- if or .Values.ap.transportConfig .Values.ap.workerPools .Values.ap.transformConfig .Values.ap.tls.secretName }}
        volumeMounts:
          {{- if or .Values.ap.transportConfig .Values.ap.workerPools .Values.ap.transformConfig }}
          - name: ap-config
            mountPath: /etc/async-processor/config
            readOnly: true
          {{- end }}
          {{- if .Values.ap.tls.secretName }}
          - name: tls-certs
            mountPath: /etc/tls
            readOnly: true
          {{- end }}
        {{- end }}
      serviceAccountName: {{ include "async-processor.fullname" . }}
      terminationGracePeriodSeconds: 130
      {{- if or .Values.ap.transportConfig .Values.ap.workerPools .Values.ap.transformConfig .Values.ap.tls.secretName }}
      volumes:
        {{- if or .Values.ap.transportConfig .Values.ap.workerPools .Values.ap.transformConfig }}
        - name: ap-config
          configMap:
            name: {{ include "async-processor.fullname" . }}-config
        {{- end }}
        {{- if .Values.ap.tls.secretName }}
        - name: tls-certs
          secret:
            secretName: {{ .Values.ap.tls.secretName }}
        {{- end }}
      {{- end }}
