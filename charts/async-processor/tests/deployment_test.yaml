suite: deployment
templates:
  - templates/ap-deployments.yaml
tests:
  - it: should render a Deployment
    asserts:
      - isKind:
          of: Deployment

  - it: should set pod-level security context
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.securityContext.seccompProfile.type
          value: RuntimeDefault

  - it: should set container-level security context defaults
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.allowPrivilegeEscalation
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsNonRoot
          value: true
      - equal:
          path: spec.template.spec.containers[0].securityContext.capabilities.drop
          value:
            - ALL

  - it: should allow overriding container security context
    set:
      ap.securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        runAsUser: 1000
    asserts:
      - equal:
          path: spec.template.spec.containers[0].securityContext.readOnlyRootFilesystem
          value: false
      - equal:
          path: spec.template.spec.containers[0].securityContext.runAsUser
          value: 1000

  - it: should set default resource requests and limits
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 100m
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 256Mi
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: 500m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 512Mi

  - it: should allow overriding resources
    set:
      ap.resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 1Gi
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 200m
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: 1Gi

  - it: should expose metrics port
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 9090
            protocol: TCP

  - it: should use custom metrics port
    set:
      ap.metrics.port: 8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].ports
          content:
            name: metrics
            containerPort: 8080
            protocol: TCP

  - it: should pass default metrics port to binary args
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-port=9090

  - it: should pass custom metrics port to binary args
    set:
      ap.metrics.port: 8080
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --metrics-port=8080

  - it: should pass --transport with the configured transport type
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --transport=redis-sortedset

  - it: should pass transport config file when transportConfig is set
    set:
      ap.transportConfig:
        result_queue_name: "result-list"
        queues:
          - queue_name: "q1"
            igw_base_url: "http://igw:80"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --transport-config-file=/etc/async-processor/config/transport.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ap-config
            mountPath: /etc/async-processor/config
            readOnly: true

  - it: should default the image to the published repo with the appVersion tag
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/llm-d-incubation/llm-d-async:0.7.0

  - it: should honor an explicit image tag override
    set:
      ap.image.tag: "v1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: ghcr.io/llm-d-incubation/llm-d-async:v1.2.3

  - it: should inject OTel env vars when endpoint is set
    set:
      ap.otel.endpoint: "http://otel:4317"
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
            value: "http://otel:4317"
          any: true
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_SERVICE_NAME
            value: "async-processor"
          any: true

  - it: should not inject OTel env vars when endpoint is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: OTEL_EXPORTER_OTLP_ENDPOINT
          any: true

  - it: should mount TLS volume when secretName is set
    set:
      ap.tls.secretName: my-tls-secret
    asserts:
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs
            mountPath: /etc/tls
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: tls-certs
            secret:
              secretName: my-tls-secret

  - it: should not mount TLS volume when secretName is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: tls-certs
          any: true

  - it: should mount config volume and pass pool-config-file when workerPools are set
    set:
      ap.workerPools:
        - id: default
          workers: 8
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --pool-config-file=/etc/async-processor/config/worker-pools.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ap-config
            mountPath: /etc/async-processor/config
            readOnly: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: ap-config
            configMap:
              name: RELEASE-NAME-async-processor-config

  - it: should inject REDIS_URL from secret when redis is enabled
    set:
      ap.redis.enabled: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
            valueFrom:
              secretKeyRef:
                name: redis-creds
                key: url
          any: true

  - it: should not inject REDIS_URL when redis is disabled
    set:
      ap.redis.enabled: false
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: REDIS_URL
          any: true

  - it: should pass transform-config-file and mount the config when transformConfig is set
    set:
      ap.transformConfig:
        requestTransforms:
          - name: "gcs-whisper"
            type: "gcs_uri_multipart"
            parameters:
              providers: ["whisper"]
    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: --transform-config-file=/etc/async-processor/config/transform-config.json
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: ap-config
            mountPath: /etc/async-processor/config
            readOnly: true

  - it: should not pass transform-config-file when transformConfig is empty
    asserts:
      - notContains:
          path: spec.template.spec.containers[0].args
          content: --transform-config-file=/etc/async-processor/config/transform-config.json
